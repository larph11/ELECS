<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile PCB Designer</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #1a1a1a; color: #eee; overflow: hidden; touch-action: none; }
        #toolbar { background: #2d2d2d; padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 2px solid #444; z-index: 10; }
        #canvas-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #121212; position: relative; }
        canvas { background: #002b1a; border: 2px solid #333; touch-action: none; }
        .btn { background: #444; color: white; border: 1px solid #666; padding: 10px 8px; cursor: pointer; border-radius: 4px; font-size: 12px; flex: 1; min-width: 70px; }
        .btn-danger { background: #c0392b; }
        input { width: 40px; background: #222; color: #0f0; border: 1px solid #555; padding: 4px; }
        .hint { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 10px; color: #666; pointer-events: none; }
    </style>
</head>
<body>

<div id="toolbar">
    <button class="btn" onclick="undo()">Undo</button>
    <button class="btn btn-danger" onclick="deleteSelected()">Del</button>
    <button class="btn" onclick="addComponent('resistor')">+Res</button>
    <button class="btn" onclick="addComponent('capacitor')">+Cap</button>
    <button class="btn" onclick="addComponent('transistor')">+T92</button>
    <button class="btn" onclick="rotateSelected()">Rot</button>
    <div style="display:flex; align-items:center; gap:4px;">
        <input type="number" id="pcbW" value="10" onchange="updateBoard()">
        <input type="number" id="pcbH" value="8" onchange="updateBoard()">
    </div>
</div>

<div id="canvas-container">
    <canvas id="pcbCanvas"></canvas>
    <div class="hint">Tap component to select. Drag the blue ✥ handle to move. Tap yellow nodes to wire.</div>
</div>

<script>
    const canvas = document.getElementById('pcbCanvas');
    const ctx = canvas.getContext('2d');
    
    let ppi = 45; 
    let components = [];
    let traces = [];
    let history = [];
    let selectedID = null;
    let isDragging = false;
    let currentTrace = null;
    let dragOffset = { x: 0, y: 0 };
    let fitScale = 1;

    function saveState() {
        history.push(JSON.stringify({ c: components, t: traces }));
        if (history.length > 20) history.shift();
    }

    function undo() {
        if (history.length > 0) {
            const state = JSON.parse(history.pop());
            components = state.c; traces = state.t;
            selectedID = null; draw();
        }
    }

    function updateBoard() {
        const wVal = parseFloat(document.getElementById('pcbW').value);
        const hVal = parseFloat(document.getElementById('pcbH').value);
        canvas.width = wVal * ppi;
        canvas.height = hVal * ppi;
        
        const container = document.getElementById('canvas-container');
        fitScale = Math.min((container.clientWidth - 20) / canvas.width, (container.clientHeight - 20) / canvas.height, 2);
        canvas.style.transform = `scale(${fitScale})`;
        draw();
    }

    // --- MOBILE TOUCH & MOUSE COORDS ---
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) / fitScale,
            y: (clientY - rect.top) / fitScale
        };
    }

    function addComponent(type) {
        saveState();
        const comp = {
            id: 'c' + Date.now(),
            x: canvas.width / 2, y: canvas.height / 2,
            type, rotation: 0,
            realW: type === 'resistor' ? 0.3 : 0.22,
            realH: type === 'resistor' ? 0.12 : 0.2,
            nodes: (type === 'resistor') ? [{rx:-0.2, ry:0}, {rx:0.2, ry:0}] :
                   (type === 'capacitor') ? [{rx:-0.08, ry:0}, {rx:0.08, ry:0}] :
                   [{rx:-0.06, ry:-0.05}, {rx:0.06, ry:-0.05}, {rx:0, ry:0.07}]
        };
        components.push(comp);
        selectedID = comp.id;
        draw();
    }

    const startAction = (e) => {
        const {x, y} = getPos(e);
        
        // 1. Check Handle (✥) - Made hit area larger (30px) for fingers
        if (selectedID) {
            const sel = components.find(c => c.id === selectedID);
            const hY = (sel.realH * ppi / 2) + 45;
            if (Math.hypot(x - sel.x, y - (sel.y + hY)) < 30) {
                isDragging = true;
                dragOffset = { x: x - sel.x, y: y - sel.y };
                saveState();
                return;
            }
        }

        // 2. Check Nodes (Wiring) - Made hit area 25px
        let foundNode = null;
        components.forEach(c => {
            c.nodes.forEach(n => {
                const rad = c.rotation * Math.PI / 180;
                const px = c.x + (n.rx * ppi * Math.cos(rad) - n.ry * ppi * Math.sin(rad));
                const py = c.y + (n.rx * ppi * Math.sin(rad) + n.ry * ppi * Math.cos(rad));
                if (Math.hypot(x - px, y - py) < 25) foundNode = {x: px, y: py};
            });
        });

        if (foundNode) {
            if (!currentTrace) {
                currentTrace = { pts: [foundNode] };
            } else {
                currentTrace.pts.push(foundNode);
                saveState();
                traces.push(currentTrace);
                currentTrace = null;
            }
            draw(); return;
        }

        // 3. Select Body
        const hit = components.find(c => Math.hypot(x - c.x, y - c.y) < 40);
        if (hit) { selectedID = hit.id; } 
        else { 
            if (currentTrace) currentTrace.pts.push({x, y});
            else selectedID = null; 
        }
        draw();
    };

    const moveAction = (e) => {
        if (!isDragging && !currentTrace) return;
        const {x, y} = getPos(e);
        if (isDragging && selectedID) {
            const sel = components.find(c => c.id === selectedID);
            sel.x = Math.round(x/5)*5; sel.y = Math.round(y/5)*5;
            draw();
        } else if (currentTrace) {
            draw(x, y);
        }
        e.preventDefault();
    };

    // Listen for both Mouse and Touch
    canvas.addEventListener('mousedown', startAction);
    canvas.addEventListener('touchstart', (e) => { startAction(e); e.preventDefault(); }, {passive: false});
    window.addEventListener('mousemove', moveAction);
    window.addEventListener('touchmove', (e) => { moveAction(e); }, {passive: false});
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);

    function deleteSelected() {
        saveState();
        components = components.filter(c => c.id !== selectedID);
        traces = traces.filter(t => t.id !== selectedID);
        selectedID = null; draw();
    }

    function rotateSelected() {
        const sel = components.find(c => c.id === selectedID);
        if (sel) { saveState(); sel.rotation = (sel.rotation + 90) % 360; draw(); }
    }

    function draw(mx, my) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        [...traces, currentTrace].forEach(t => {
            if(!t) return;
            ctx.beginPath(); ctx.moveTo(t.pts[0].x, t.pts[0].y);
            t.pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
            if (t === currentTrace && mx) ctx.lineTo(mx, my);
            ctx.stroke();
        });

        components.forEach(c => {
            ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rotation * Math.PI / 180);
            const w = c.realW * ppi, h = c.realH * ppi;
            if (selectedID === c.id) {
                ctx.strokeStyle = '#00bfff'; ctx.setLineDash([4, 4]);
                ctx.strokeRect(-w/2-15, -h/2-15, w+30, h+30);
                ctx.setLineDash([]);
            }
            ctx.fillStyle = (c.type === 'transistor') ? "#333" : (c.type === 'resistor' ? "#d2b48c" : "#3498db");
            if (c.type === 'transistor') {
                ctx.beginPath(); ctx.arc(0, -h/4, w/2, Math.PI, 0); ctx.lineTo(w/2, h/2); ctx.lineTo(-w/2, h/2); ctx.fill();
            } else if (c.type === 'resistor') { ctx.fillRect(-w/2, -h/2, w, h); }
            else { ctx.beginPath(); ctx.arc(0,0,w/2,0,Math.PI*2); ctx.fill(); }
            
            c.nodes.forEach(n => {
                ctx.fillStyle = '#ffea00';
                ctx.beginPath(); ctx.arc(n.rx*ppi, n.ry*ppi, 6, 0, Math.PI*2); ctx.fill();
            });
            ctx.restore();

            if (selectedID === c.id) {
                const hY = (h/2) + 45;
                ctx.fillStyle = '#007acc'; ctx.beginPath(); ctx.arc(c.x, c.y + hY, 22, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
                ctx.fillText('✥', c.x, c.y + hY + 8);
            }
        });
    }

    window.onresize = updateBoard;
    updateBoard();
</script>
</body>
</html>
