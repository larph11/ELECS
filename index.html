<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro PCB Designer - Complete Suite</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #1a1a1a; color: #eee; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        #toolbar { background: #2d2d2d; padding: 10px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid #444; z-index: 100; justify-content: center; }
        #canvas-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #121212; position: relative; overflow: hidden; }
        canvas { background: #002b1a; border: 2px solid #333; touch-action: none; }
        .btn { background: #444; color: white; border: 1px solid #666; padding: 12px 6px; cursor: pointer; border-radius: 6px; font-size: 11px; font-weight: bold; min-width: 45px; }
        .btn.active { background: #007acc; border-color: #00bfff; box-shadow: 0 0 8px #007acc; }
        .btn-save { background: #2980b9; }
        .btn-load { background: #8e44ad; }
        .btn-danger { background: #c0392b; }
        #load-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2d2d2d; border: 2px solid #007acc; padding: 20px; border-radius: 12px; z-index: 1000; width: 80%; max-width: 300px; box-shadow: 0 0 50px #000; }
        .load-item { background: #444; padding: 10px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
        #pin-selector { position: absolute; display: none; background: #222; border: 2px solid #00ff00; padding: 12px; border-radius: 12px; flex-direction: column; align-items: center; z-index: 200; }
        .pin-grid { display: flex; gap: 8px; }
        .pin-btn { background: #333; color: #0f0; border: 1px solid #0f0; padding: 10px 15px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<div id="toolbar">
    <button id="btnMove" class="btn active" onclick="setMode('MOVE')">✥ MOVE</button>
    <button id="btnWire" class="btn" onclick="setMode('WIRE')">✎ WIRE</button>
    <button class="btn btn-save" onclick="saveProject()">💾 SAVE</button>
    <button class="btn btn-load" onclick="openLoadModal()">📂 LOAD</button>
    <button class="btn btn-danger" onclick="deleteSelected()">🗑</button>
    <button class="btn" onclick="addComponent('resistor')">+R</button>
    <button class="btn" onclick="addComponent('capacitor')">+C</button>
    <button class="btn" onclick="addComponent('transistor')">+T</button>
    <button class="btn" style="background:#d35400" onclick="addComponent('terminal')">+TML</button>
    <button class="btn" onclick="rotateSelected()">↻</button>
</div>

<div id="canvas-container">
    <canvas id="pcbCanvas"></canvas>
    <div id="pin-selector">
        <div id="pin-buttons" class="pin-grid"></div>
        <button class="pin-btn" style="color:#ff4444; border-color:#ff4444; margin-top:5px;" onclick="cancelWire()">CANCEL</button>
    </div>
</div>

<div id="load-modal">
    <h3 style="margin-top:0">Load Project</h3>
    <div id="load-list"></div>
    <button class="btn" style="width:100%" onclick="document.getElementById('load-modal').style.display='none'">CLOSE</button>
</div>

<script>
    const canvas = document.getElementById('pcbCanvas');
    const ctx = canvas.getContext('2d');
    const pinSelector = document.getElementById('pin-selector');
    const pinButtons = document.getElementById('pin-buttons');
    
    let ppi = 60, components = [], traces = [], selectedID = null;
    let isDragging = false, currentTrace = null, fitScale = 1, mode = 'MOVE';
    let activeTraceIdx = -1, activeWaypointIdx = -1;
    const wireColors = ['#00ffcc', '#ff00ff', '#ffff00', '#0099ff', '#ff5500', '#77ff00'];

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const t = (e.touches && e.touches[0]) ? e.touches[0] : e;
        return { x: (t.clientX - rect.left) / fitScale, y: (t.clientY - rect.top) / fitScale };
    }

    function checkIntersect(p1, p2, p3, p4) {
        const det = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
        if (det === 0) return null;
        const lambda = ((p4.y - p3.y) * (p4.x - p1.x) + (p3.x - p4.x) * (p4.y - p1.y)) / det;
        const gamma = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / det;
        if (!(0.1 < lambda && lambda < 0.9) || !(0.1 < gamma && gamma < 0.9)) return null;
        return { x: p1.x + lambda * (p2.x - p1.x), y: p1.y + lambda * (p2.y - p1.y) };
    }

    function distToSegment(p, v, w) {
        const l2 = Math.hypot(v.x - w.x, v.y - w.y)**2;
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function getNodePos(target) {
        if (!target) return null;
        if (target.type === 'wire') return { x: target.x, y: target.y };
        const c = components.find(comp => comp.id === target.compId);
        if (!c) return null;
        const n = c.nodes[target.nodeIdx], rad = c.rotation * Math.PI / 180;
        return { x: c.x + (n.rx*ppi*Math.cos(rad) - n.ry*ppi*Math.sin(rad)), y: c.y + (n.rx*ppi*Math.sin(rad) + n.ry*ppi*Math.cos(rad)) };
    }

    function addComponent(type) {
        let nodes = (type==='resistor'||type==='capacitor') ? [{rx:-0.2, ry:0}, {rx:0.2, ry:0}] : 
                    (type==='transistor') ? [{rx:-0.2, ry:0.1}, {rx:0.2, ry:0.1}, {rx:0, ry:-0.1}] : [{rx:0, ry:0}];
        components.push({ id: 'c'+Date.now(), x: canvas.width/2, y: canvas.height/2, type, rotation: 0, nodes });
        draw();
    }

    function startHandler(e) {
        const {x, y} = getPos(e);
        if (mode === 'MOVE') {
            for (let i = 0; i < traces.length; i++) {
                for (let j = 0; j < traces[i].waypoints.length; j++) {
                    if (Math.hypot(x - traces[i].waypoints[j].x, y - traces[i].waypoints[j].y) < 20) {
                        activeTraceIdx = i; activeWaypointIdx = j; isDragging = true; selectedID = 't' + i; draw(); return;
                    }
                }
            }
            const comp = components.find(c => Math.hypot(x-c.x, y-c.y) < 35);
            if (comp) { selectedID = comp.id; isDragging = true; }
        } else if (mode === 'WIRE') {
            const comp = components.find(c => Math.hypot(x-c.x, y-c.y) < 35);
            if (comp) {
                showPinSelector(comp, e);
            } else {
                let nearWire = null;
                traces.forEach(t => {
                    const pts = [getNodePos(t.start), ...t.waypoints, getNodePos(t.end)];
                    for(let i=0; i<pts.length-1; i++) {
                        if(pts[i] && pts[i+1] && distToSegment({x,y}, pts[i], pts[i+1]) < 10) nearWire = {x: Math.round(x/5)*5, y: Math.round(y/5)*5};
                    }
                });
                if (nearWire && confirm("Connect to this wire?")) {
                    const node = { type: 'wire', x: nearWire.x, y: nearWire.y };
                    if (!currentTrace) currentTrace = { start: node, end: null, waypoints: [], color: wireColors[Math.floor(Math.random()*wireColors.length)] };
                    else { currentTrace.end = node; traces.push(currentTrace); currentTrace = null; }
                } else if (currentTrace) {
                    currentTrace.waypoints.push({x: Math.round(x/5)*5, y: Math.round(y/5)*5});
                }
            }
        }
        draw();
    }

    function showPinSelector(comp, e) {
        pinButtons.innerHTML = ''; pinSelector.style.display = 'flex';
        const t = (e.touches && e.touches[0]) ? e.touches[0] : e;
        pinSelector.style.left = `${t.clientX - 50}px`; pinSelector.style.top = `${t.clientY - 50}px`;
        comp.nodes.forEach((n, idx) => {
            const btn = document.createElement('button'); btn.className = 'pin-btn'; 
            btn.innerText = comp.type === 'terminal' ? 'JOIN' : (idx + 1);
            btn.onclick = () => {
                const node = { compId: comp.id, nodeIdx: idx };
                if (!currentTrace) currentTrace = { start: node, end: null, waypoints: [], color: wireColors[Math.floor(Math.random()*wireColors.length)] };
                else { currentTrace.end = node; traces.push(currentTrace); currentTrace = null; }
                pinSelector.style.display = 'none'; draw();
            };
            pinButtons.appendChild(btn);
        });
    }

    function drawSegmentWithJumps(p1, p2, traceIdx) {
        let intersections = [];
        traces.forEach((other, oIdx) => {
            if (oIdx === traceIdx) return;
            const os = getNodePos(other.start), oe = getNodePos(other.end);
            if (!os || !oe) return;
            let oPts = [os, ...other.waypoints, oe];
            for (let j = 0; j < oPts.length - 1; j++) {
                const inter = checkIntersect(p1, p2, oPts[j], oPts[j+1]);
                if (inter) {
                    const isConnected = (traces[traceIdx].start.type === 'wire' && Math.hypot(inter.x - traces[traceIdx].start.x, inter.y - traces[traceIdx].start.y) < 5) || 
                                      (traces[traceIdx].end && traces[traceIdx].end.type === 'wire' && Math.hypot(inter.x - traces[traceIdx].end.x, inter.y - traces[traceIdx].end.y) < 5);
                    if (!isConnected) intersections.push(inter);
                }
            }
        });
        intersections.sort((a, b) => Math.hypot(p1.x - a.x, p1.y - a.y) - Math.hypot(p1.x - b.x, p1.y - b.y));
        intersections.forEach(inter => {
            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            ctx.lineTo(inter.x - Math.cos(angle)*8, inter.y - Math.sin(angle)*8);
            ctx.arc(inter.x, inter.y, 8, angle + Math.PI, angle, false);
        });
        ctx.lineTo(p2.x, p2.y);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        traces.forEach((t, tidx) => {
            const s = getNodePos(t.start), e = getNodePos(t.end);
            if(!s) return;
            let pts = [s, ...t.waypoints]; if(e) pts.push(e);
            ctx.strokeStyle = t.color; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.moveTo(s.x, s.y);
            for(let i=0; i<pts.length-1; i++) drawSegmentWithJumps(pts[i], pts[i+1], tidx);
            ctx.stroke();
            if (t.start.type === 'wire') { ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, Math.PI*2); ctx.fill(); }
            if (t.end && t.end.type === 'wire') { ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, Math.PI*2); ctx.fill(); }
            if (mode === 'MOVE') t.waypoints.forEach(p => { ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill(); });
        });

        if (currentTrace) {
            const s = getNodePos(currentTrace.start);
            if(s) {
                ctx.strokeStyle = '#0f0'; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(s.x, s.y);
                currentTrace.waypoints.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke(); ctx.setLineDash([]);
            }
        }

        components.forEach(c => {
            ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rotation * Math.PI / 180);
            if (selectedID === c.id) { ctx.strokeStyle = '#00bfff'; ctx.strokeRect(-25, -20, 50, 40); }
            ctx.fillStyle = c.type==='terminal'?'#ffea00':(c.type==='capacitor'?'#3498db':'#d2b48c');
            if (c.type==='capacitor') { ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill(); ctx.fillStyle="white"; ctx.fillText("+",-12,-4); }
            else if (c.type==='terminal') { ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill(); }
            else { ctx.fillRect(-20,-12,40,24); }
            c.nodes.forEach(n => { ctx.fillStyle='#0f0'; ctx.beginPath(); ctx.arc(n.rx*ppi, n.ry*ppi, 4, 0, Math.PI*2); ctx.fill(); });
            ctx.restore();
        });
    }

    function saveProject() {
        const name = prompt("Name project:", "New Circuit");
        if (!name) return;
        const lib = JSON.parse(localStorage.getItem('pcb_lib') || '{}');
        lib[name] = { components, traces };
        localStorage.setItem('pcb_lib', JSON.stringify(lib));
        alert("Saved!");
    }

    function openLoadModal() {
        const lib = JSON.parse(localStorage.getItem('pcb_lib') || '{}');
        const list = document.getElementById('load-list'); list.innerHTML = '';
        Object.keys(lib).forEach(name => {
            const item = document.createElement('div'); item.className = 'load-item';
            item.innerHTML = `<span>${name}</span><span style="color:#f44" onclick="deleteProj('${name}', event)">✖</span>`;
            item.onclick = () => { components = lib[name].components; traces = lib[name].traces; draw(); document.getElementById('load-modal').style.display='none'; };
            list.appendChild(item);
        });
        document.getElementById('load-modal').style.display = 'block';
    }

    function deleteProj(name, e) { e.stopPropagation(); const lib = JSON.parse(localStorage.getItem('pcb_lib') || '{}'); delete lib[name]; localStorage.setItem('pcb_lib', JSON.stringify(lib)); openLoadModal(); }

    window.addEventListener('touchmove', (e) => { 
        if (!isDragging) return;
        const {x, y} = getPos(e);
        const gx = Math.round(x/5)*5, gy = Math.round(y/5)*5;
        if (activeTraceIdx !== -1) traces[activeTraceIdx].waypoints[activeWaypointIdx] = {x: gx, y: gy};
        else { const c = components.find(comp => comp.id === selectedID); if (c) { c.x = gx; c.y = gy; } }
        draw();
    }, {passive: false});

    window.addEventListener('touchend', () => { isDragging = false; activeTraceIdx = -1; activeWaypointIdx = -1; });
    canvas.addEventListener('touchstart', startHandler);
    function setMode(m) { mode = m; draw(); document.getElementById('btnMove').className = 'btn ' + (m==='MOVE'?'active':''); document.getElementById('btnWire').className = 'btn ' + (m==='WIRE'?'active':''); }
    function rotateSelected() { const c = components.find(comp => comp.id === selectedID); if(c){ c.rotation=(c.rotation+90)%360; draw(); } }
    function deleteSelected() { components = components.filter(c => c.id !== selectedID); traces = traces.filter(t => (t.start && t.start.compId !== selectedID) && (!t.end || t.end.compId !== selectedID)); selectedID = null; draw(); }
    function cancelWire() { currentTrace = null; pinSelector.style.display='none'; draw(); }
    
    canvas.width = 10 * ppi; canvas.height = 8 * ppi;
    function updateBoard() {
        fitScale = Math.min((window.innerWidth - 20) / canvas.width, (window.innerHeight - 150) / canvas.height, 2.5);
        canvas.style.transform = `scale(${fitScale})`;
        draw();
    }
    window.addEventListener('resize', updateBoard);
    updateBoard();
</script>
</body>
</html>
